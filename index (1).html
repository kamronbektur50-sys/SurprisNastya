<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Наша история</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14111a; --bg2:#1c1824; --text:#f1e9ee; --muted:#a99fb0;
  --accent:#e8b4b8; --line:rgba(232,180,184,.28);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(60% 40% at 20% 0%,rgba(232,180,184,.12),transparent),
             radial-gradient(50% 40% at 90% 100%,rgba(150,120,200,.12),transparent)}
section{padding:12vh 24px}
.wrap{max-width:720px;margin:0 auto}

/* Обложка */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-top:env(safe-area-inset-top,0)}
.hero small{letter-spacing:.35em;text-transform:uppercase;color:var(--muted);font-size:.75rem}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(3rem,12vw,6.5rem);line-height:1.05;margin:.3em 0}
.hero h1 em{color:var(--accent)}
.hero p{color:var(--muted);max-width:420px}
.scroll{margin-top:56px;color:var(--accent);animation:float 2.4s ease-in-out infinite;font-size:1.4rem}
@keyframes float{50%{transform:translateY(8px)}}

/* Хронология */
.timeline{position:relative;padding-left:34px}
.timeline::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:linear-gradient(var(--line),var(--line) 92%,transparent)}
.chapter{position:relative;margin-bottom:14vh}
.chapter::before{content:"";position:absolute;left:-34px;top:.7em;width:11px;height:11px;border-radius:50%;background:var(--bg);border:1px solid var(--accent);box-shadow:0 0 0 5px rgba(232,180,184,.12)}
.date{color:var(--accent);letter-spacing:.2em;text-transform:uppercase;font-size:.72rem}
.chapter h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,6vw,2.7rem);line-height:1.15;margin:.2em 0 .5em}
.chapter p{color:#d8ced6;white-space:pre-line}
.gallery{display:grid;gap:10px;margin-top:26px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.ph{aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#2a2233,#1c1824);border:1px solid var(--line);position:relative;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s}
.ph:hover img{transform:scale(1.04)}
.ph.empty{cursor:default;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:var(--muted);font-size:.72rem}
.gallery.single{grid-template-columns:1fr}
.gallery.single .ph{aspect-ratio:4/5;max-width:440px}.ph.vid{aspect-ratio:auto!important;cursor:default;max-width:440px}.ph video{width:100%;display:block;border-radius:14px}

/* Появление при прокрутке */
.reveal{opacity:0;transform:translateY(28px);transition:opacity 1s ease,transform 1s ease}
.reveal.in{opacity:1;transform:none}

/* Счётчик */
.counter{text-align:center;background:var(--bg2);border-block:1px solid var(--line)}
.counter h3{font-family:var(--serif);font-weight:400;font-style:italic;font-size:1.6rem;color:var(--muted)}
.nums{display:flex;justify-content:center;gap:clamp(18px,6vw,48px);margin:28px 0 12px;flex-wrap:wrap}
.nums div{min-width:70px}
.nums b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(2.6rem,10vw,4.2rem);color:var(--accent);line-height:1}
.nums span{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

/* Финал */
.finale{text-align:center;min-height:90svh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.finale h2{font-family:var(--serif);font-weight:400;font-size:clamp(3.5rem,16vw,8rem);line-height:1}
button.btn{margin-top:36px;background:none;color:var(--text);border:1px solid var(--accent);padding:14px 34px;border-radius:99px;font:inherit;letter-spacing:.12em;cursor:pointer;transition:.4s}
button.btn:hover{background:var(--accent);color:var(--bg)}
.after{max-height:0;opacity:0;overflow:hidden;transition:max-height 1.4s ease,opacity 1.4s ease;max-width:520px}
.after.open{max-height:700px;opacity:1;margin-top:40px}
.after p{font-family:var(--serif);font-size:1.5rem;font-style:italic;line-height:1.5;color:#e6dbe1;white-space:pre-line}
.after .sign{font-family:var(--sans);font-style:normal;font-size:.85rem;color:var(--accent);margin-top:24px;letter-spacing:.1em}

/* Лайтбокс */
#lb{position:fixed;inset:0;background:rgba(10,8,14,.94);display:none;align-items:center;justify-content:center;z-index:10;cursor:zoom-out;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:92vh;border-radius:10px}
@media (prefers-reduced-motion:reduce){.reveal{transition:none;opacity:1;transform:none}.scroll{animation:none}}
#gate{display:none;position:fixed;inset:0;z-index:20;background:var(--bg)}
#gate p{margin-top:8px}
.heart{position:fixed;top:-6vh;color:var(--accent);opacity:.85;pointer-events:none;z-index:5;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(300deg)}}
</style>
</head>
<body>
<div id="gate" class="hero"><small>Для тебя, <span id="gn"></span></small><h1>Ещё <em>чуть-чуть</em></h1><p>Этот подарок откроется 3 декабря</p><div class="nums" id="cd"></div></div>

<header class="hero">
  <small id="kicker"></small>
  <h1>Наша <em>история</em></h1>
  <p id="lead"></p>
  <div class="scroll">↓</div>
</header>

<section><div class="wrap"><div class="timeline" id="timeline"></div></div></section>

<section class="counter reveal">
  <div class="wrap">
    <h3>А сейчас мы вместе уже</h3>
    <div class="nums" id="nums"></div>
    <small id="since" style="color:var(--muted)"></small>
  </div>
</section>

<section class="finale">
  <h2 class="reveal">Конец?</h2>
  <button class="btn reveal" id="btn">Дочитать до конца</button>
  <div class="after" id="after"></div>
</section>

<div id="lb"><img alt=""></div>

<script>
/* =====================================================
   ✏️ ВСЁ, ЧТО НУЖНО МЕНЯТЬ, — ЗДЕСЬ
   Фото кладёшь в папку photos/ рядом с index.html
   и пишешь имена файлов в массиве photos.
   Если фото нет — на его месте будет подсказка с именем файла.
   ===================================================== */
const ru=d=>new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
const START = "2025-05-25";   // ← дата начала отношений (ГГГГ-ММ-ДД), от неё считается счётчик

const CONFIG = {
  herName: ["Настюша", "любимая", "солнышко"],   // при каждом открытии выбирается одно из слов
  fromName: "Всегда твой",
  startDate: START,
  unlock: "2026-12-03",   // до этой даты сайт закрыт; в этот день — поздравление и сердечки
  lead: "Небольшая история о том, как мы дошли от случайного разговора до «мы».",

  chapters: [
    { date:"23 ноября 2024 · Сургут", title:"Знакомство",
      text:"Мероприятие в Сургуте. Мы сразу разговорились — легко, будто знали друг друга давно.\nЯ тогда ещё не понимал, что это начало.",
      photos:["media/intro.mp4"] },
    { date:"24 декабря 2024", title:"Почти месяц тишины",
      text:"После Сургута мы целый месяц не общались.\nА 24 декабря всё началось заново: одно сообщение — и разговоры уже было не остановить.",
      photos:["photos/p8399.jpg"] },
    { date:"Зима 2025", title:"Первая прогулка и 14 февраля по-нашему",
      text:"Первая прогулка среди новогодних декораций. Я успел дать тебе подножку, и ты улетела в сугроб. А ты всё равно осталась.\nА 14 февраля мы дарили друг другу не валентинки, а свой чёрный юмор. Это же мы.",
      photos:["photos/p8402.jpg","photos/p8409.jpg"] },
    { date:"18 апреля 2025", title:"Твои глаза на моём экране",
      text:"Ещё до «официально» твои глаза уже стояли у меня на заставке. Я просто пока никому не признавался.",
      photos:["photos/p0033.jpg","photos/p8420.jpg","photos/p8425.jpg"] },
    { date:ru(START), title:"Мы",
      text:"День, с которого мы начали считать.\nСлово «мы» стало моим любимым.",
      photos:["photos/p8427.jpg","photos/p8428.jpg","photos/p8429.jpg","photos/p8430.jpg"] },
    { date:"Лето 2025", title:"Лавочки, дворы и дурачества",
      text:"Лето прошло на лавочках, во дворах и в парках. Мы корчили рожи и смеялись над всем подряд.\nЛучшее время — когда ничего особенного не происходит, а рядом ты.",
      photos:["photos/p8433.jpg","photos/p8431.jpg","photos/p8435.jpg","photos/p8441.jpg","photos/p8442.jpg","photos/p8443.jpg"] },
    { date:"Наше место", title:"Пиццерия",
      text:"Здесь мы отмечали, кормили друг друга и просто сидели часами. Пицца, кола, колпаки на головах — и ты рядом.",
      photos:["photos/p8456.jpg","photos/p8464.jpg","photos/p8465.jpg","photos/p8466.jpg","photos/p8467.jpg","photos/p8446.jpg","photos/p8461.jpg"] },
    { date:"Огонёк", title:"Серия, которая не гаснет",
      text:"В TikTok у нас огонёк: сначала 36 дней, потом 65 — и «шкайфик» вырос до максимума.\nМы умеем держаться за хорошее.",
      photos:["photos/p8406.jpg","photos/p8412.jpg"] },
    { date:"Осень 2025", title:"Золото, закаты и твои руки",
      text:"Осень принесла жёлтые листья, закаты на набережной и тёплые объятия в подъездах.",
      photos:["photos/p8445.jpg","photos/p8448.jpg","photos/p8449.jpg","photos/p8438.jpg","photos/p8439.jpg","photos/p0214.jpg"] },
    { date:"Дом и уют", title:"Наши вечера",
      text:"Игры в наушниках, нутелла из банки и твоя щека рядом с моей. Самые простые вечера — самые любимые.",
      photos:["photos/p8452.jpg","photos/p8453.jpg","photos/p8454.jpg","photos/p7977.jpg","photos/p8482.jpg","photos/p8473.jpg"] },
    { date:"Мой день рождения", title:"Ты собрала всех",
      text:"Ты устроила мне вечер, который я не забуду: друзья, огни, смех.\nСпасибо, что умеешь дарить такое.",
      photos:["photos/p8458.jpg","photos/p8462.jpg"] },
    { date:"Москва", title:"Наша поездка",
      text:"Цветочная рамка, ВДНХ, тени, сложившиеся в сердце. Мы были далеко от дома, но рядом друг с другом.",
      photos:["photos/p8472.jpg","photos/p8483.jpg","photos/p8480.jpg","photos/p8478.jpg","photos/p8479.jpg"] },
    { date:"Сегодня", title:"Здесь и сейчас",
      text:"Я не знаю, что будет дальше, но знаю точно: хочу, чтобы ты была рядом.",
      photos:["photos/p8475.jpg"] }
  ],

  finale: "Конец первой главы.\nПотому что у такой истории не бывает последней страницы — она просто перелистывается на следующую.\n\nВторая глава уже пишется. Автор — мы.",
};
/* ===================== дальше можно не трогать ===================== */

const $ = s => document.querySelector(s);
const NAME = Array.isArray(CONFIG.herName) ? CONFIG.herName[Math.floor(Math.random() * CONFIG.herName.length)] : CONFIG.herName;
const UN = new Date(CONFIG.unlock + 'T00:00:00'), nowD = new Date();
const preview = /preview/.test(location.search);
const locked = !preview && nowD < UN;
const isBday = nowD.getMonth() === UN.getMonth() && nowD.getDate() === UN.getDate();
$('#kicker').textContent = isBday ? 'С днём рождения, ' + NAME + ' ♥' : 'Для тебя, ' + NAME;
if (locked) {
  $('#gate').style.display = 'flex'; document.body.style.overflow = 'hidden'; $('#gn').textContent = NAME;
  const tick = () => { const d = UN - new Date(); if (d <= 0) return location.reload(); const t = Math.floor(d / 1000);
    $('#cd').innerHTML = [[Math.floor(t / 86400), 'дн.'], [Math.floor(t % 86400 / 3600), 'ч.'], [Math.floor(t % 3600 / 60), 'мин.'], [t % 60, 'сек.']].map(x => `<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join(''); };
  tick(); setInterval(tick, 1000);
} else if ((isBday || preview) && !matchMedia('(prefers-reduced-motion:reduce)').matches) {
  for (let i = 0; i < 40; i++) { const h = document.createElement('span'); h.className = 'heart'; h.textContent = '♥';
    h.style.cssText = `left:${Math.random() * 100}vw;font-size:${12 + Math.random() * 22}px;animation-duration:${6 + Math.random() * 6}s;animation-delay:${Math.random() * 6}s`;
    document.body.appendChild(h); setTimeout(() => h.remove(), 14000); }
}
$('#lead').textContent = CONFIG.lead;

// Хронология
const tl = $('#timeline');
CONFIG.chapters.forEach(c => {
  const el = document.createElement('article');
  el.className = 'chapter reveal';
  const n = c.photos.length;
  el.innerHTML = `<div class="date">${c.date}</div><h2>${c.title}</h2><p>${c.text}</p>` +
    (n ? `<div class="gallery ${n === 1 ? 'single' : ''}"></div>` : '');
  const g = el.querySelector('.gallery');
  (c.photos || []).forEach(src => {
    const d = document.createElement('div');
    if (/\.mp4$/i.test(src)) { d.className='ph vid'; d.innerHTML='<video src="'+src+'" controls playsinline preload="metadata"></video>'; g.appendChild(d); return; }
    d.className = 'ph';
    const img = new Image();
    img.loading = 'lazy'; img.src = src; img.alt = '';
    img.onerror = () => { d.className = 'ph empty'; d.textContent = '📷 ' + src; img.remove(); };
    d.onclick = () => { if (!d.classList.contains('empty')) { $('#lb img').src = src; $('#lb').classList.add('on'); } };
    d.appendChild(img); g.appendChild(d);
  });
  tl.appendChild(el);
});
$('#lb').onclick = () => $('#lb').classList.remove('on');

// Счётчик
(function(){
  const s = new Date(CONFIG.startDate + 'T00:00:00'), now = new Date();
  let y = now.getFullYear() - s.getFullYear(), m = now.getMonth() - s.getMonth(), d = now.getDate() - s.getDate();
  if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  const total = Math.floor((now - s) / 864e5);
  const items = [[y, 'лет'], [m, 'мес.'], [d, 'дн.']].filter((x, i) => x[0] > 0 || i === 2);
  $('#nums').innerHTML = items.map(x => `<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
  $('#since').textContent = `это ${total} дней с ${s.toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'})} — и каждый мне дорог`;
})();

// Финал
const after = $('#after');
after.innerHTML = `<p>${CONFIG.finale}</p><p class="sign">${CONFIG.fromName}</p>`;
$('#btn').onclick = () => { after.classList.add('open'); $('#btn').style.display = 'none'; setTimeout(() => after.scrollIntoView({behavior:'smooth', block:'center'}), 300); };

// Плавное появление
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.15});
document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
</body>
</html>
